<svg viewBox="0 0 700 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="sb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #050505; }
      .txt {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        fill: #00FF9C;
        filter: url(#sb);
        animation: pulse 2.2s ease-in-out infinite;
        letter-spacing: 4px;
      }
      .brk { fill: #00FF9C; opacity: 0.6; }
      @keyframes pulse {
        0%, 100% { filter: url(#sb) drop-shadow(0 0 4px #00FF9C) drop-shadow(0 0 10px #00FF9C); }
        50%      { filter: url(#sb) drop-shadow(0 0 12px #00FF9C) drop-shadow(0 0 26px #00FF9C); }
      }
    </style>
  </defs>
  <rect class="bg" width="700" height="90" rx="8"/>
  <text x="30" y="56" class="brk" font-family="Courier New" font-size="30">&gt;</text>
  <text x="65" y="56" class="txt" font-size="30">CONNECT</text>
</svg>
