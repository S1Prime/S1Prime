<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #050505; }
      .name {
        font-family: 'Courier New', monospace;
        font-weight: 700;
        fill: #00FF9C;
        filter: url(#softblur);
        animation: pulse 2.4s ease-in-out infinite;
      }
      .underline {
        stroke: #00FF9C;
        stroke-width: 2;
        filter: url(#softblur);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          filter: url(#softblur) drop-shadow(0 0 6px #00FF9C) drop-shadow(0 0 14px #00FF9C);
        }
        50% {
          opacity: 0.75;
          filter: url(#softblur) drop-shadow(0 0 16px #00FF9C) drop-shadow(0 0 32px #00FF9C);
        }
      }
    </style>
  </defs>
  <rect class="bg" width="900" height="180" rx="12"/>
  <text x="450" y="105" text-anchor="middle" class="name" font-size="70">S1PRIME</text>
  <line class="underline" x1="220" y1="135" x2="680" y2="135"/>
</svg>
